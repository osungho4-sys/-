name: Update KARINA Universe

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - '메인'
    paths:
      - 'karina/run-now.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect latest KARINA updates
        run: python scripts/update_karina.py

      - name: Commit updates when changed
        run: |
          git config user.name "karina-universe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add karina/data/latest.json
          if git diff --cached --quiet; then
            echo "No new changes"
          else
            git commit -m "Auto-update KARINA latest data"
            git push
          fi
